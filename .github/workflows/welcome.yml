name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **OpenSourceMate**! Thank you for opening your first issue.

            - Please make sure your issue details include clear context, expected vs actual behavior, or proposal goals.
            - Check out our [Contributing Guide](https://github.com/Muskankr/OpenSourceMate/blob/main/CONTRIBUTING.md) and [Labels Guide](https://github.com/Muskankr/OpenSourceMate/blob/main/docs/LABELS.md) to learn how we organize work.
            - A maintainer will review your issue shortly!
          pr-message: |
            🎉 Congratulations on submitting your first pull request to **OpenSourceMate**!

            - Automated CI checks will test your changes shortly.
            - Please ensure your PR description links the corresponding issue (`Fixes #<number>`) and follows our [Contributing Guide](https://github.com/Muskankr/OpenSourceMate/blob/main/CONTRIBUTING.md).
            - If you are new to Git workflows, check out our [First Contribution Guide](https://github.com/Muskankr/OpenSourceMate/blob/main/FIRST_CONTRIBUTION.md).
            - A maintainer will review your contribution soon. Thank you for your support!
